name: Coverage comment

# Runs after Tests completes, in the trusted base-repo context (never checks out
# or executes PR code). This is why it can safely hold pull-requests: write and
# comment on fork PRs — unlike test.yml, which runs untrusted PR code read-only.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    # Only for PR-triggered Tests runs that produced an artifact.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read coverage values
        id: cover
        run: |
          echo "total=$(cat coverage/total.txt)" >> "$GITHUB_OUTPUT"
          echo "pr=$(cat coverage/pr.txt)" >> "$GITHUB_OUTPUT"

      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          number: ${{ steps.cover.outputs.pr }}
          message: |
            ### Test coverage: ${{ steps.cover.outputs.total }}%
            Threshold: 80%
