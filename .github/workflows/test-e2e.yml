name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      focus:
        description: Ginkgo focus regex, e.g. "Authmiddleware TLS" (empty runs the full suite)
        required: false
        default: ""
      ref:
        description: Git ref to test, e.g. refs/pull/508/merge for a fork PR (empty tests the dispatched ref)
        required: false
        default: ""

jobs:
  test-e2e:
    name: E2E (Kind)
    runs-on: ubuntu-latest
    permissions:
      contents: read # To checkout code

    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Install kubebuilder
        run: |
          curl -L -o kubebuilder "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v4.13.1/kubebuilder_$(go env GOOS)_$(go env GOARCH)"
          chmod +x kubebuilder
          sudo mv kubebuilder /usr/local/bin/

      - name: Running Test e2e
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          go mod tidy
          # Use Docker instead of Finch in GitHub Actions
          if [ -n "$FOCUS" ]; then
            make test-e2e-focus FOCUS="$FOCUS" CONTAINER_TOOL=docker
          else
            make test-e2e CONTAINER_TOOL=docker
          fi
