apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: locked-alongside-workspace
  namespace: default
spec:
  displayName: "Workspace adding a volume alongside the locked volumes"
  desiredStatus: Stopped
  templateRef:
    name: locked-volumes-template
    namespace: jupyter-k8s-shared
  volumes:
    - name: team
      persistentVolumeClaimName: policy-shared-fs
      mountPath: /home/jovyan/team
      subPath: namespaces/ml
    - name: mine
      persistentVolumeClaimName: policy-datasets
      mountPath: /home/jovyan/mine
