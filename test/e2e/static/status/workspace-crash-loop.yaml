# A workspace whose container exits at once, so the kubelet restarts it with back-off and reports CrashLoopBackOff.
apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: workspace-crash-loop
  namespace: default
spec:
  displayName: "Status Test - Crash Loop"
  image: jk8s-application-jupyter-uv:latest
  containerConfig:
    command: ["sh", "-c", "exit 1"]
  desiredStatus: Running
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi
