# A workspace whose env references a Secret that does not exist, so the kubelet reports
# CreateContainerConfigError until the Secret appears.
apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: workspace-missing-secret
  namespace: default
spec:
  displayName: "Status Test - Missing Secret"
  image: jk8s-application-jupyter-uv:latest
  env:
    - name: STATUS_TEST_TOKEN
      valueFrom:
        secretKeyRef:
          name: status-test-missing-secret
          key: token
  desiredStatus: Running
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi
