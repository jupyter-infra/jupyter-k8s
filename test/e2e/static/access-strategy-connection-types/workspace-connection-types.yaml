apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: workspace-connection-types
  namespace: default
spec:
  displayName: "Connection Types Workspace"
  desiredStatus: Running
  image: jk8s-application-jupyter-uv:latest
  accessType: Public
  accessStrategy:
    name: access-strategy-connection-types
    namespace: jupyter-k8s-shared
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
