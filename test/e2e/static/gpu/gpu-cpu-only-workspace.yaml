apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: gpu-cpu-only-workspace
spec:
  displayName: "GPU Opt-Out Test"
  templateRef:
    name: gpu-template
    namespace: jupyter-k8s-shared
  ownershipType: Public
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
