# The basic user flow: the user sets no resources or placement and the template's defaults apply.
# A workspace created from a GPU template in the web UI with no explicit GPU choice arrives exactly
# like this, with no resources in the request. workspace_gpu_test.go asserts the 1-GPU request and
# the placement on the workspace and its pod; the explicit request case is gpu-override-workspace.yaml.
apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: gpu-default-workspace
spec:
  displayName: "GPU Defaults Test"
  templateRef:
    name: gpu-template
    namespace: jupyter-k8s-shared
  ownershipType: Public
