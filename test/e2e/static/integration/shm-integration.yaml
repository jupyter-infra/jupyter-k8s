# Integration that brings its own /dev/shm, as the Ray integration in jupyter-k8s-aws does: one memory-backed
# volume mounted into both the sidecar and the workspace container so the two share it.
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceIntegrationTemplate
metadata:
  name: shm-integration
  namespace: jupyter-k8s-shared
spec:
  displayName: "Shared memory integration"
  # resourceRefs is required; the Service is only looked up, nothing is read from it.
  resourceRefs:
    - name: cache
      apiVersion: v1
      kind: Service
      metadata:
        name: shared-cache
  deploymentModifications:
    podModifications:
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 192Mi
      additionalContainers:
        - name: shm-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      primaryContainerModifications:
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
