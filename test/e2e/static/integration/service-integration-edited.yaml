apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceIntegrationTemplate
metadata:
  name: service-integration
  namespace: jupyter-k8s-shared
spec:
  displayName: Shared Service Integration
  # Same metadata.name as service-integration.yaml, so applying this UPDATES the template in place. The
  # only change is an added primary-container env var (CACHE_EDITED_MARKER); parameters are untouched, so
  # a referencing workspace's parametersHash stays the same while the template's Generation bumps. That is
  # the observedIntegrationTemplateVersion trigger: an admin edit re-resolves and re-renders the pod.
  parameters:
    - name: serviceName
  shareProcessNamespace: true
  resourceRefs:
    - name: cache
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .Parameters.serviceName }}"
  statusProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "[ \"{{ resource \"cache\" \"{.metadata.name}\" }}\" = shared-cache ]"
  deploymentModifications:
    podModifications:
      additionalContainers:
        - name: cache-proxy
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - "echo connecting to {{ resource \"cache\" \"{.metadata.name}\" }}:{{ resource \"cache\" \"{.spec.ports[0].port}\" }} && sleep infinity"
      primaryContainerModifications:
        mergeEnv:
          - name: CACHE_HOST
            valueTemplate: '{{ resource "cache" "{.metadata.name}" }}'
          - name: CACHE_PORT
            valueTemplate: '{{ resource "cache" "{.spec.ports[0].port}" }}'
          - name: CACHE_SERVICE_NAME
            valueTemplate: "{{ .Parameters.serviceName }}"
          # The single edit under test: a new resolved env var that must appear on the pod only after the
          # admin edits the template (observedIntegrationTemplateVersion bump -> re-resolve + re-render).
          - name: CACHE_EDITED_MARKER
            valueTemplate: '{{ resource "cache" "{.metadata.name}" }}-edited'
