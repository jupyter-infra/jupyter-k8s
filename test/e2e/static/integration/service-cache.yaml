apiVersion: v1
kind: Service
metadata:
  name: shared-cache
  namespace: default
spec:
  # ClusterIP is assigned dynamically, so the integration reads the stable name + declared port, never
  # the IP. A headless service (clusterIP: None) keeps the fixture self-contained with no selector churn.
  # The integration resolves the port by index ({.spec.ports[0].port}), so the port NAME is arbitrary.
  clusterIP: None
  ports:
    - name: cache
      port: 6379
