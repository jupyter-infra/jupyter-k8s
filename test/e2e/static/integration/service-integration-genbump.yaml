apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceIntegrationTemplate
metadata:
  name: service-integration
  namespace: jupyter-k8s-shared
spec:
  # Same metadata.name as service-integration.yaml, so this UPDATES the template in place. The ONLY change
  # is displayName -- a spec field, so it bumps .metadata.generation (releasing the freeze) but renders
  # nothing onto the pod. So the only value that can change is one re-read from the (drifted) Service.
  displayName: Shared Service Integration (generation bump, no render change)
  parameters:
    - name: serviceName
  shareProcessNamespace: true
  resourceRefs:
    - name: cache
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .Parameters.serviceName }}"
  statusProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "[ \"{{ resource \"cache\" \"{.metadata.name}\" }}\" = shared-cache ]"
  deploymentModifications:
    podModifications:
      additionalContainers:
        - name: cache-proxy
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - "echo connecting to {{ resource \"cache\" \"{.metadata.name}\" }}:{{ resource \"cache\" \"{.spec.ports[0].port}\" }} && sleep infinity"
      primaryContainerModifications:
        mergeEnv:
          - name: CACHE_HOST
            valueTemplate: '{{ resource "cache" "{.metadata.name}" }}'
          - name: CACHE_PORT
            valueTemplate: '{{ resource "cache" "{.spec.ports[0].port}" }}'
          - name: CACHE_SERVICE_NAME
            valueTemplate: "{{ .Parameters.serviceName }}"
