# Template without any shared memory setting; the lazy-default flow adds one while workspaces exist.
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: shm-template-plain
  namespace: jupyter-k8s-shared
spec:
  displayName: "Shared memory not mentioned"
  defaultImage: jk8s-application-jupyter-uv:latest
  defaultResources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  resourceBounds:
    resources:
      cpu:
        min: 100m
        max: "2"
      memory:
        min: 128Mi
        max: 4Gi
  appType: jupyter
