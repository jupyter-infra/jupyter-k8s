# Rejected: the workspace's own /dev/shm volume exceeds the template's 128Mi maximum.
apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: shm-user-volume-over-limit-workspace
spec:
  displayName: "shm-user-volume-over-limit-workspace"
  templateRef:
    name: shm-template-capped
    namespace: jupyter-k8s-shared
  ownershipType: Public
  volumes:
    - name: shm
      mountPath: /dev/shm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
