# Template without sharedMemory: workspaces get the /dev/shm volume sized to their 512Mi memory limit.
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: shm-template
  namespace: jupyter-k8s-shared
spec:
  displayName: "Shared memory default"
  defaultImage: jk8s-application-jupyter-uv:latest
  defaultResources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  resourceBounds:
    resources:
      cpu:
        min: 100m
        max: "2"
      memory:
        min: 128Mi
        max: 4Gi
  primaryStorage:
    defaultSize: 1Gi
  appType: jupyter
