# A workspace may lower the template's 128Mi size limit.
apiVersion: workspace.jupyter.org/v1alpha1
kind: Workspace
metadata:
  name: shm-lowered-workspace
spec:
  displayName: "shm-lowered-workspace"
  templateRef:
    name: shm-template-capped
    namespace: jupyter-k8s-shared
  ownershipType: Public
  sharedMemory:
    sizeLimit: 96Mi
